[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22.12.0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[redirects]]
  from = "/race-info"
  to = "/race-center/"
  status = 301
[[redirects]]
  from = "/rules"
  to = "/competition-guide/"
  status = 301
[[redirects]]
  from = "/paint-booth"
  to = "/paint-schemes/"
  status = 301
[[redirects]]
  from = "/paints"
  to = "/paint-schemes/"
  status = 301
