<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UARL Team Roster Embed</title><style>
:root{--c:#169cff;--c2:#fff;--bg:#07090e;--fg:#fff;--muted:#aeb6c4}*{box-sizing:border-box}body{margin:0;background:transparent;color:var(--fg);font-family:Inter,Arial,sans-serif}.embed{width:100%;max-width:920px;margin:0 auto;background:linear-gradient(145deg,#0c1018,#05070b);border:1px solid rgba(255,255,255,.13);overflow:hidden}.head{position:relative;padding:20px;border-left:6px solid var(--c);background:linear-gradient(110deg,color-mix(in srgb,var(--c) 18%,#0b0e14),#0b0e14 58%)}.logo{display:block;max-width:min(380px,75%);max-height:110px;object-fit:contain;object-position:left center}.fallback{font:900 clamp(2.1rem,6vw,4.2rem)/.85 Impact,'Arial Narrow',sans-serif;text-transform:uppercase}.meta{margin-top:10px;color:var(--muted);font-size:.83rem}.palette{position:absolute;right:18px;top:18px;display:flex;gap:5px}.sw{width:26px;height:26px;border:1px solid rgba(255,255,255,.35)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:rgba(255,255,255,.09)}.entry{min-width:0;padding:16px;background:#0b0f17}.num{font:900 2.4rem/.9 Impact,'Arial Narrow',sans-serif}.num img{width:72px;height:72px;object-fit:contain}.name{margin-top:9px;font-weight:900;text-transform:uppercase}.status{margin-top:5px;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid rgba(255,255,255,.1);color:var(--muted);font-size:.75rem}.foot a{color:#d8ff3e;text-decoration:none;font-weight:800;text-transform:uppercase}@media(max-width:520px){.head{padding:16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.entry{padding:13px}.num img{width:62px;height:62px}.palette{right:12px;top:12px}.sw{width:20px;height:20px}.foot{align-items:flex-start;flex-direction:column}}
.shared{grid-column:1/-1;padding:14px 16px;background:linear-gradient(145deg,rgba(239,30,35,.12),#0b0f17);border-top:2px solid #ef1e23}.shared h3{margin:0 0 10px;font:900 1.05rem/1 Inter,sans-serif;text-transform:uppercase;letter-spacing:.08em}.shared-options{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}.shared-option{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid rgba(255,255,255,.1);background:#0b0f17}.shared-option .num img{width:58px;height:58px}.shared-or{font-weight:900;color:#8f98a8}@media(max-width:520px){.shared-options{grid-template-columns:1fr}.shared-or{text-align:center}}</style><link rel="icon" href="/favicon.ico" sizes="any">

</head><body><main class="embed" id="app"></main><script>
const TEAMS={"dakota": {"name": "Dakota Sullivan Racing", "owner": "Dale", "make": "Chevrolet", "color": "#e4b63f", "logo": null, "entries": [["16", "Dale", "Full-Time"], ["19", "Max", "Signed"], ["20", "Nurtec", "Full-Time"], ["61", "Plane", "Full-Time"], ["91", "Opt", "Signed"]]}, "xdrive": {"name": "XDrive Motorsports", "owner": "John", "make": "Chevrolet", "color": "#e4b63f", "logo": null, "entries": [["21", "OPEN", "Open FT"], ["25", "OPEN", "Open FT"], ["44", "OPEN", "Open FT"], ["89", "OPEN", "Open FT"]]}, "avery": {"name": "Avery Motorsports", "owner": "Payson", "make": "Ford", "color": "#1683ff", "logo": null, "entries": [["05", "Payson", "Full-Time"], ["58", "Shane", "Full-Time"], ["60", "Cody", "Full-Time"], ["72", "Daniel", "Full-Time"], ["73", "Frog", "Signed"]]}, "whitlock": {"name": "Goat Whitlock Motorsports", "owner": "James", "make": "Toyota", "color": "#ef3340", "logo": null, "entries": [["9", "OPEN", "Open FT"], ["24", "John", "Full-Time"], ["48", "Taylor", "Signed"], ["84", "James", "Full-Time"]]}, "goforth": {"name": "Goforth Motorsports", "owner": "Cody", "make": "Ford", "color": "#1683ff", "logo": null, "entries": [["1", "OPEN", "Open FT"], ["77", "King", "Full-Time"], ["80", "Gman", "Full-Time"], ["88", "Lance", "Full-Time"], ["97", "Part-Time Charter", "Part-Time Charter"]]}, "aetherwing": {"name": "Aetherwing eMotorsports", "owner": "Wispy", "make": "Toyota", "color": "#ef1e23", "color2": "#ffffff", "logo": "/assets/aetherwing/logo.webp", "founded": "Season 3", "entries": [["28", "Wispy", "Full-Time"], ["32", "BurgerTown2Good", "Signed"], ["52", "Gk3r", "Signed"], ["54", "OPEN", "Open FT"], ["92", "Rocky", "Full-Time"], ["62", "Part-Time Entry", "6th Charter"], ["82", "Development Entry", "6th Charter"]]}};const AEM={28:'/assets/aetherwing/numbers/28.png',32:'/assets/aetherwing/numbers/32.png',52:'/assets/aetherwing/numbers/52.png',54:'/assets/aetherwing/numbers/54.png',62:'/assets/aetherwing/numbers/62.png',82:'/assets/aetherwing/numbers/82.png',92:'/assets/aetherwing/numbers/92.png'};const q=new URLSearchParams(location.search),id=q.get('team')||'aetherwing',t=TEAMS[id]||TEAMS.aetherwing;document.documentElement.style.setProperty('--c',t.color||'#169cff');document.documentElement.style.setProperty('--c2',t.color2||'#fff');function e(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}const logo=t.logo?`<img class="logo" src="${e(t.logo)}" alt="${e(t.name)} logo">`:`<div class="fallback">${e(t.name)}</div>`;const entryCard=x=>{const art=id==='aetherwing'&&AEM[x[0]]?`<span class="num"><img src="${AEM[x[0]]}" alt="#${e(x[0])}"></span>`:`<span class="num">#${e(x[0])}</span>`;return `<article class="entry">${art}<div class="name">${e(x[1])}</div><div class="status">${e(x[2])}</div></article>`};let entries;if(id==='aetherwing'){const ft=t.entries.filter(x=>!['62','82'].includes(String(x[0])));const pt=t.entries.find(x=>String(x[0])==='62'),dev=t.entries.find(x=>String(x[0])==='82');const special=x=>{const art=`<span class="num"><img src="${AEM[x[0]]}" alt="#${e(x[0])}"></span>`;return `<div class="shared-option">${art}<div><div class="name">${e(x[1])}</div><div class="status">#${e(x[0])} · ${e(x[2])}</div></div></div>`};entries=ft.map(entryCard).join('')+`<section class="shared"><h3>6th Charter · One shared slot</h3><div class="shared-options">${special(pt)}<div class="shared-or">OR</div>${special(dev)}</div></section>`}else{entries=t.entries.map(entryCard).join('')};document.getElementById('app').innerHTML=`<header class="head">${logo}<div class="palette"><span class="sw" style="background:${e(t.color||'#169cff')}"></span><span class="sw" style="background:${e(t.color2||'#fff')}"></span></div><div class="meta">${e(t.make)} · Owner: ${e(t.owner)}${t.founded?' · Founded '+e(t.founded):''}</div></header><section class="grid">${entries}</section><footer class="foot"><span>UARL Season 6 Team Roster</span><a href="/drivers/?team=${encodeURIComponent(id)}" target="_top">View full Team HQ ↗</a></footer>`;
</script></body></html>
